services:
  polybotking:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polybotking
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Embedded health/status dashboard (served by main.py)
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - botnet
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=5).status==200 else 1)\"",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  botnet:
    driver: bridge
